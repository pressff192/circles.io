# Необов'язково: публікація ЛИШЕ клієнта (public/) на GitHub Pages.
# Для онлайн-режиму вкажи адрес окремого сервера в public/config.js (window.GAME_SERVER).
# Запуск: вкладка Actions → "Deploy client to GitHub Pages" → Run workflow
# (у Settings → Pages має бути Source: GitHub Actions).
name: Deploy client to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
