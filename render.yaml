# Blueprint для Render.com: New + → Blueprint → вибери цей репозиторій
services:
  - type: web
    name: cells-io
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MAX_PLAYERS
        value: 80
